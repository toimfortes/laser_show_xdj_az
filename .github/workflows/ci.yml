name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install dependencies needed for unit tests. Heavy optional extras
      # (beatnet, ml) that require native libs not available in vanilla GH
      # runners are still excluded; librosa and the web-panel stack are
      # included so the full unit suite can run.
      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pydantic pydantic-settings pyyaml \
            structlog click \
            numpy \
            langgraph langchain-core \
            librosa \
            fastapi uvicorn httpx \
            ruff mypy \
            pytest pytest-cov

      - name: Install package (editable, no extras)
        run: pip install -e . --no-deps

      # -----------------------------------------------------------------------
      # Linting
      # -----------------------------------------------------------------------
      - name: ruff check
        run: ruff check src tests

      # -----------------------------------------------------------------------
      # Type checking (pragmatic: ignore missing stubs for optional deps)
      # -----------------------------------------------------------------------
      - name: mypy
        run: |
          mypy src \
            --ignore-missing-imports \
            --no-error-summary \
            --exclude 'src/photonic_synesthesia/ui/web_panel\.py'
        # web_panel uses a dynamic-import pattern (_import_web_stack) that
        # returns tuple[Any, ...]; mypy cannot narrow the unpacked names
        # back to their real fastapi types. Excluded from mypy only —
        # the file still runs under pytest in CI (fastapi is installed).

      # -----------------------------------------------------------------------
      # Unit tests
      # -----------------------------------------------------------------------
      - name: pytest
        run: |
          pytest tests/ -v \
            --tb=short \
            --ignore=tests/integration \
            --deselect=tests/unit/test_production_hardening.py::test_feature_extract_suppresses_short_signal_fft_warnings \
            -p no:asyncio
        # The single deselected test is a known test-isolation flake
        # (warnings filter leaks between test modules in the full suite;
        # passes alone). All optional-extra tests now run because
        # librosa / fastapi / uvicorn are installed above.
        env:
          # Prevent sounddevice / ALSA from emitting noise on headless runners
          SDL_AUDIODRIVER: dummy
